---
# Minimal inventory_basevars fragment for a single-Satellite deployment.
# Copy the full inventory_basevars.yml from rhis-builder-inventory, then
# replace / merge the relevant sections with the values below.

global_domain_name: "your.domain"

default_network: "192.168.0.0"
default_network_prefix: "22"
default_network_mask: "255.255.252.0"

rhis_primary_city: "YourCity"
rhis_primary_state: "YourState"
rhis_timezone: "America/New_York"
rhis_locale: "en"

rhis_aap_release_version: "2.6"

rhis_system_count:
  satellite: 1
  discosatellite: 0
  capsule: 0
  idm: 0
  aapcontroller: 0
  aaphub: 0
  quadlet: 0
