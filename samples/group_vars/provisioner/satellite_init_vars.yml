---
# Sample host definition for a single Red Hat Satellite server.
# Copy this file into rhis-builder-bootstrap-init/group_vars/provisioner/
# and customize the values marked "CHANGE ME".
#
# This file uses the *named list* pattern (satellite_bootstrap_init_hosts)
# so the playbook extra-var works cleanly:
#   -e "bootstrap_init_hosts={{ satellite_bootstrap_init_hosts }}"
#
# Alternative: rename the list to bootstrap_init_hosts and omit the extra-var.

bootstrap_init_ks_path: "ks.cfg"
bootstrap_init_oem_dir: "/mnt/OEMDRV"
bootstrap_init_iso_dir: "/mnt/OEMDRV/ISO"

satellite_bootstrap_init_hosts:
  - rhis_role: "satellite"
    hostname: "satellite1"                    # CHANGE ME
    domain: "your.domain"                     # CHANGE ME
    mac: "aa:bb:cc:dd:ee:ff"                  # CHANGE ME
    ipv4_address: "192.168.0.21"              # CHANGE ME
    ipv4_netmask: "255.255.252.0"             # CHANGE ME
    ipv4_prefix: 22                           # CHANGE ME
    ipv4_gateway: "192.168.0.1"               # CHANGE ME
    name_server1: "192.168.0.5"               # CHANGE ME
    name_server2: "192.168.0.6"               # CHANGE ME
    root_enc_pass: "{{ encrypted_root_pass_vault }}"
    grub_enc_pass: "{{ encrypted_grub_pass_vault }}"
    # filesystem: "ext4"       # Default is xfs; uncomment for ext4
    boot_disk: "/dev/nvme0n1"                 # CHANGE ME
    root_disk: "/dev/nvme0n1"                 # CHANGE ME
    # additional_disks:        # Extends root VG across multiple devices
    #   - "/dev/sda"
    boot_mb: 1024
    boot_efi_mb: 2048
    lv_root_mb: 65536
    lv_home_mb: 20480
    lv_tmp_mb: 6144
    lv_var_tmp_mb: 6144
    lv_var_log_mb: 6144
    lv_var_log_audit_mb: 6144
    lv_var_mb: 1               # Set to 1 to grow into all remaining space (≥1 TiB disk recommended)
    username: "ansiblerunner"
    user_enc_pass: "{{ encrypted_user_pass_vault }}"
    user_sudoer_policy: "{{ user_sudoer_policy_vault }}"
    ssh_pub_key: "{{ ssh_pub_key_vault }}"
    org: "{{ cdn_organization_vault }}"
    activation_key: "{{ cdn_activation_key_vault }}"
    generate_oemdrv_iso: false  # Set true for ISO virtual media delivery
    # disconnected: true        # Uncomment for air-gapped; omit org/activation_key
